apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
      tolerations:
      - effect: NoSchedule
        operator: Exists

