apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 3
  serviceName: demo
  #updateStrategy:
    #type: RollingUpdate
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1

---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: demo
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080

