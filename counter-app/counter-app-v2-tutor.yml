---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-httpd
  labels:
    app: counter
spec:
  selector:
    matchLabels:
      app: counter
  replicas: 1
  template:
    metadata:
      labels:
        app: counter
        component: httpd
    spec:
      containers:
      - name: httpd
        image: registry.kamilbaran.pl/training/kubernetes/httpd:latest
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: counter-httpd
  labels:
    app: counter
spec:
  type: NodePort
  selector:
    app: counter
    component: httpd
  ports:
  - port: 80
    protocol: TCP
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-mongo
  labels:
    app: counter
spec:
  selector:
    matchLabels:
      app: counter
  replicas: 1
  template:
    metadata:
      labels:
        app: counter
        component: mongo
    spec:
      containers:
      - name: counter
        image: registry.kamilbaran.pl/training/kubernetes/mongo:latest
        ports:
        - name: counter
          containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: counter-mongo
  labels:
    app: counter
spec:
  type: NodePort
  selector:
    app: counter
    component: mongo
  ports:
  - port: 27017
    protocol: TCP
    targetPort: http

