apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter
  labels:
    app: counter
    component: httpd
spec:
  ingressClassName: nginx
  rules:
  - host: daniel.counter.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: counter-httpd
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: counter-httpd
  labels:
    app: counter
    component: httpd
spec:
  type: ClusterIP
  selector:
    app: counter
    component: httpd
  ports:
  - port: 80
    targetPort: http
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-httpd
  labels:
    app: counter
    component: httpd
spec:
  replicas: 3
  selector:
    matchLabels:
      app: counter
      component: httpd
  template:
    metadata:
      labels:
        app: counter
        component: httpd
    spec:
      containers:
      - name: httpd
        image: registry.kamilbaran.pl/training/kubernetes/httpd:latest
        env:
        - name: MONGO_CS
          value: mongodb://counter-mongo:27017 #mongo service name
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: counter-mongo
  labels:
    app: counter
    component: mongo
spec:
  type: ClusterIP
  clusterIP: None #
  selector:
    app: counter
    component: mongo
  ports:
  - port: 27017
    targetPort: mongo
    name: mongo
---
apiVersion: apps/v1
kind: StatefulSet #
metadata:
  name: counter-mongo
  labels:
    app: counter
    component: mongo
spec:
  replicas: 3 #
  serviceName: counter-mongo #
  selector:
    matchLabels:
      app: counter
      component: mongo
  template:
    metadata:
      labels:
        app: counter
        component: mongo
        version: stable
    spec:
      containers:
      - name: mongo
        image: registry.kamilbaran.pl/training/kubernetes/mongo:latest
        command:
        - /usr/bin/mongod
        - --dbpath=/data/db
        - --bind_ip_all
        - --wiredTigerCacheSizeGB=1
        ports:
        - name: mongo
          containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumeClaimTemplates: #
  - metadata:
      name: mongo-data
    spec:
      storageClassName: rook-cephfs
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
