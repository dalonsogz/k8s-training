---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter
  labels:
    app: counter
spec:
  selector:
    matchLabels:
      app: counter
  replicas: 2
  template:
    metadata:
      labels:
        app: counter
    spec:
      containers:
      - name: http
        image: registry.kamilbaran.pl/training/kubernetes/httpd:latest
        ports:
        - name: http
          containerPort: 80
      - name: mongo
        image: registry.kamilbaran.pl/training/kubernetes/mongo:latest
        ports:
        - name: mongo
          containerPort: 27017
apiVersion: v1
kind: Service
metadata:
  name: counter
  labels:
    app: counter
spec:
  type: NodePort
  selector:
    app: counter
  ports:
  - port: 80
    protocol: TCP
    targetPort: http
    name: http
  - port: 27017
    protocol: TCP
    targetPort: mongo
    name: mongo

