---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-1
  labels:
    app: demo-2
spec:
  selector:
    matchLabels:
      app: demo-4
  replicas: 3
  template:
    metadata:
      labels:
        app: demo-4
    spec:
      containers:
      - name: demo-5
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo-7
spec:
  type: ClusterIP
  selector:
    app: demo-4
  ports:
  - port: 80
    protocol: TCP
    targetPort: http
 
