---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 3
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
        ports:
        - name: http
          containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
#  type: ClusterIP
#  type: LoadBalancer
  selector:
    app: demo
  ports:
  - port: 80
    protocol: TCP
    targetPort: http

