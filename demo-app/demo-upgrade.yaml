---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  selector:
    matchLabels:
      app: demo
      version: stable
  replicas: 3
  template:
    metadata:
      labels:
        app: demo
        version: stable
    spec:
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-new
spec:
  selector:
    matchLabels:
      app: demo
      version: new
  replicas: 3
  template:
    metadata:
      labels:
        app: demo
        version: new
    spec: 
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v2
---
apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  selector:
    app: demo
    version: new
  ports:
  - port: 80
    targetPort: 8080

