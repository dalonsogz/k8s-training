apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-network-policy
  labels:
    app: demo
spec:
  podSelector:
    matchLabels:
      app: demo
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: demo-client
    ports:
    - port: 8080
      protocol: TCP

