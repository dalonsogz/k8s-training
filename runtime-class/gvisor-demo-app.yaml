---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvisor-demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      runtimeClassName: gvisor
      containers:
      - name: demo
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
        ports:
        - name: http
          containerPort: 8080
