apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: training
  labels:
    app: training
spec:
  selector:
    matchLabels:
      app: training
  template:
    metadata:
      labels:
        app: training
    spec:
      containers:
      - name: training
        image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
        imagePullPolicy: Always
      tolerations:
      - effect: NoSchedule
        operator: Exists

# https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/-

# kubectl taint node k8s-worker-1 effect:NoSchedule
# kubectl taint node k8s-worker-1 effect:NoSchedule-

# kubectl cordon k8s-worker-1
# kubectl drain k8s-worker-1
# kubectl uncordon k8s-worker-1

