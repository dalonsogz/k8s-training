---
apiVersion: v1
kind: Pod
metadata:
  name: seccomp
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/blacklist.json # relative to /var/lib/kubelet/seccomp
  containers:
  - name: demo
    image: registry.kamilbaran.pl/training/kubernetes/demo-app:v1
    securityContext:
      allowPrivilegeEscalation: false

