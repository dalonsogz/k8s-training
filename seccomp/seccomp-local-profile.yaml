---
apiVersion: v1
kind: Pod
metadata:
  name: seccomp
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/audit.json # relative to /var/lib/kubelet/seccomp
  containers:
  - name: amicontained
    image: r.j3ss.co/amicontained
    args: [amicontained]
    securityContext:
      allowPrivilegeEscalation: false

