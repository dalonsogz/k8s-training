---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:1-alpine
        resources:
        volumeMounts:
        - name: html-data
          mountPath: /usr/share/nginx/html
      - name: content-maker
        image: alpine:latest
        command: ["/bin/sh"]
        args: ["-c", "while :; do date > /tmp/index.html ; sleep 5; done"]
        volumeMounts:
        - name: html-data
          mountPath: /tmp
      volumes:
      - name: html-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    #nodePort: 30080

