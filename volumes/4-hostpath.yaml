---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:1-alpine
        resources:
        volumeMounts:
        - name: demo-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: demo-volume
        hostPath:
          path: /tmp/html
          type: DirectoryOrCreate 
          #type: DirectoryOrCreate, Directory, File, FileOrCreate, Socket, CharDevice, BlockDevice

---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    #nodePort: 30080

