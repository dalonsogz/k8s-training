---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:1-alpine
        resources:
        volumeMounts:
        - name: demo-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: demo-volume
        persistentVolumeClaim:
          claimName: demo-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-pvc
  labels:
    app: demo
spec:
  storageClassName: rook-cephfs #
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    #nodePort: 30080

