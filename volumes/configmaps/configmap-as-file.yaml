---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: httpd
        image: registry.kamilbaran.pl/training/kubernetes/httpd:latest
        resources:
        volumeMounts:
        - name: html-data
          mountPath: /var/www/localhost/htdocs/
      volumes:
      - name: html-data
        configMap:
          name: html-data-configmap

---
apiVersion: v1
kind: Service
metadata:
  name: httpd
spec:
  type: NodePort
  selector:
    app: demo
  ports:
  - port: 80
    targetPort: 80
    #nodePort: 30080

