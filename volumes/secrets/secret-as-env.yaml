apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: kamilbaran/training:httpd
        resources:
        env:
        - name: TRAINING
          valueFrom:
            secretKeyRef:
              name: html-data-secret
              key: training
        - name: COMPANY
          valueFrom:
            secretKeyRef:
              name: html-data-secret
              key: company

