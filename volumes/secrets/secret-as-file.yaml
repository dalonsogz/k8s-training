---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: httpd
        image: kamilbaran/training:httpd
        resources:
        volumeMounts:
        - name: html-data
          mountPath: /var/www/localhost/htdocs/
      volumes:
      - name: html-data
        secret:
          secretName: html-data-secret

---
apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
  - port: 80
    targetPort: 8080
    #nodePort: 30080

